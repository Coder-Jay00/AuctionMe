services:
  postgres:
    image: postgres:16-alpine
    container_name: live-auction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auction_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction_pass}
      POSTGRES_DB: ${POSTGRES_DB:-live_auction}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auction_user} -d ${POSTGRES_DB:-live_auction}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
